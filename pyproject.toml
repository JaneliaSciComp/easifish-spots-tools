[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "easifish-spots-tools"
version = "1.4.0"
description = "EASI-FISH pipeline tools for detecting or processing spots "
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "dask==2026.6.0",
    "distributed==2026.6.0",
    "fishspot @ git+https://github.com/cgoina/fishspot.git@6e482ee",
    "flatten_json==0.1.14",
    "numpy>2,<3",
    "pynrrd==1.1.3",
    "ome-zarr-models==1.7",
    "pydantic==2.12.4",
    "pyyaml",
    "tornado",
    "zarr>3,<4",
    "zarr-tools @ git+https://github.com/JaneliaSciComp/zarr-tools.git@5c58014",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", { platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
easifish-spots-tools = { path = ".", editable = true }

[tool.pixi.pypi-options]
index-url = "https://pypi.org/simple"
# SimpleITK 3.0.0b1 (with elastix) is not on PyPI - pick it up from the GitHub release assets
find-links = [
    { url = "https://github.com/SimpleITK/SimpleITK/releases/expanded_assets/v3.0.0b1" },
]
